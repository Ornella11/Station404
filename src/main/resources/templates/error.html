<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Station404 – Erreur</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-slate-100">

<header th:replace="~{banniere :: banniere}"></header>

<main class="max-w-xl mx-auto px-4 py-16 text-center">
    <p class="text-6xl font-bold text-slate-300" th:text="${statut ?: status}">404</p>

    <h1 class="mt-4 text-2xl font-bold text-slate-800" th:switch="${statut ?: status}">
        <span th:case="404">Ressource introuvable</span>
        <span th:case="403">Accès refusé</span>
        <span th:case="409">Opération impossible</span>
        <span th:case="400">Données invalides</span>
        <span th:case="*">Une erreur est survenue</span>
    </h1>

    <p class="mt-3 text-slate-600"
       th:text="${message != null and !#strings.isEmpty(message)} ? ${message} : 'Veuillez réessayer ou revenir à l’accueil.'">
        Message d'erreur
    </p>

    <a th:href="@{/}" class="inline-block mt-8 rounded-lg bg-blue-600 px-5 py-2 font-semibold text-white hover:bg-blue-700">
        Retour à l’accueil
    </a>
</main>

</body>
</html>
