<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page de connexion</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">

<main class="w-full max-w-sm bg-white rounded-2xl shadow-lg p-8">

    <div class="text-center mb-6">
        <img th:src="@{/images/logo_Station404.png}" alt="Logo Station404" class="h-16 mx-auto mb-3">
        <h1 class="text-2xl font-bold text-slate-800">Station404</h1>
        <p class="text-sm text-slate-500">Supervision des équipements</p>
    </div>

    <p th:if="${param.error}"
       class="mb-4 rounded-lg bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-700"
       role="alert">
        Identifiant ou mot de passe incorrect.
    </p>

    <p th:if="${param.logout}"
       class="mb-4 rounded-lg bg-green-50 border border-green-200 px-4 py-3 text-sm text-green-700"
       role="status">
        Vous êtes déconnecté.
    </p>

    <form th:action="@{/login}" method="post" class="space-y-4">
        <div>
            <label for="username" class="block text-sm font-medium text-slate-700 mb-1">Identifiant</label>
            <input type="text" id="username" name="username" required autofocus
                   autocomplete="username"
                   class="w-full rounded-lg border border-slate-300 px-3 py-2
                          focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
            <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Mot de passe</label>
            <input type="password" id="password" name="password" required
                   autocomplete="current-password"
                   class="w-full rounded-lg border border-slate-300 px-3 py-2
                          focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <button type="submit"
                class="w-full rounded-lg bg-blue-600 py-2 font-semibold text-white
                       hover:bg-blue-700 transition">
            Se connecter
        </button>
    </form>

</main>

</body>
</html>
