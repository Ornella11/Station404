<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Détail de l'incident - Station404</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800">

<header th:replace="~{banniere :: banniere}"></header>

<main class="max-w-3xl mx-auto px-4 py-8 bg-slate-100">
    <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm space-y-6">

        <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-100 pb-4">
            <h1 class="text-2xl font-bold" th:text="|Incident sur ${incident.equipement.reference}|"></h1>

            <span th:switch="${incident.statutIncident.name()}">
                <span th:case="'NON_AFFECTE'" class="inline-flex items-center gap-1.5 rounded-full bg-amber-100 px-3 py-1 text-xs font-semibold text-amber-800">
                    <span class="h-2 w-2 rounded-full bg-amber-500"></span>Non affecté
                </span>
                <span th:case="'AFFECTE'" class="inline-flex items-center gap-1.5 rounded-full bg-violet-100 px-3 py-1 text-xs font-semibold text-violet-800">
                    <span class="h-2 w-2 rounded-sm bg-violet-600"></span>Affecté
                </span>
                <span th:case="'RESOLU'" class="inline-flex items-center gap-1.5 rounded-full bg-green-100 px-3 py-1 text-xs font-semibold text-green-800">
                    <span class="h-2 w-2 rounded-sm bg-green-600"></span>Résolu
                </span>
                <span th:case="*" class="inline-flex items-center gap-1.5 rounded-full bg-slate-200 px-3 py-1 text-xs font-semibold text-slate-700">
                    <span class="h-2 w-2 rounded-sm bg-slate-500"></span>Inconnu
                </span>
            </span>
        </div>

        <dl class="grid gap-x-8 gap-y-4 text-sm sm:grid-cols-2 bg-slate-50 p-4 rounded-lg border border-slate-100">
            <div>
                <dt class="text-slate-500">Équipement concerné</dt>
                <dd class="font-medium mt-0.5">
                    <a th:href="@{/equipements/{id}/incidents(id=${incident.equipement.id})}" class="text-blue-700 hover:underline"
                       th:text="${incident.equipement.reference}">EQ-0001</a>
                </dd>
            </div>
            <div>
                <dt class="text-slate-500">Prestataire assigné</dt>
                <dd class="font-medium mt-0.5" th:text="${incident.prestataire != null} ? ${incident.prestataire.nom} : 'Aucun prestataire affecté'">Aucun</dd>
            </div>
            <div>
                <dt class="text-slate-500">Ouvert le</dt>
                <dd class="font-medium mt-0.5" th:text="${#temporals.format(incident.dateOuverture, 'dd/MM/yyyy à HH:mm')}">01/11/2026 à 08:30</dd>
            </div>
            <div th:if="${incident.statutIncident.name() == 'RESOLU'}">
                <dt class="text-slate-500">Résolu le</dt>
                <dd class="font-medium mt-0.5" th:text="${incident.dateResolution != null} ? ${#temporals.format(incident.dateResolution, 'dd/MM/yyyy à HH:mm')} : 'N/A'">02/11/2026 à 10:00</dd>
            </div>
        </dl>

        <!-- Description -->
        <div th:if="${incident.description != null and !#strings.isEmpty(incident.description)}">
            <h2 class="text-sm font-semibold text-slate-500 uppercase tracking-wide">Description du problème</h2>
            <p class="mt-2 whitespace-pre-line text-sm leading-relaxed bg-white border border-slate-100 p-4 rounded-lg shadow-2xs" th:text="${incident.description}">Description.</p>
        </div>

        <!-- Section Évaluation (si résolu et prestataire présent) -->
        <div th:if="${incident.statutIncident.name() == 'RESOLU' and incident.prestataire != null}"
             class="rounded-lg border border-slate-200 p-4 text-sm bg-white">

            <div th:if="${evaluation != null}">
                <p class="text-lg font-bold" th:text="|Note : ${evaluation.note} / 5|">Note : 4 / 5</p>
                <p class="mt-1 whitespace-pre-line text-slate-600"
                   th:if="${!#strings.isEmpty(evaluation.commentaire)}"
                   th:text="${evaluation.commentaire}"></p>
            </div>

            <form th:if="${evaluation == null}"
                  th:action="@{/incidents/{id}/evaluer(id=${incident.id})}" method="post"
                  class="flex flex-wrap items-center gap-3">
                <select name="note" required class="rounded-lg border border-slate-300 px-3 py-2 text-sm">
                    <option value="">Note</option>
                    <option th:each="n : ${#numbers.sequence(1, 5)}" th:value="${n}" th:text="${n} + ' / 5'"></option>
                </select>
                <button type="submit" class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700">
                    Évaluer le prestataire
                </button>
            </form>
        </div>

        <div class="flex flex-wrap items-center justify-between gap-3 border-t border-slate-100 pt-5">
            <a th:href="${incident.statutIncident.name() == 'RESOLU'} ? @{/incidents/historique} : @{/incidents}" class="text-sm text-slate-600 hover:underline">← Retour à la liste</a>
            <a th:unless="${incident.statutIncident.name() == 'RESOLU'}"
               th:href="@{/incidents/{id}/modifier(id=${incident.id})}"
               class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">
                Modifier
            </a>

            <div th:unless="${incident.statutIncident.name() == 'RESOLU'}" class="flex flex-wrap gap-2">
                <a th:href="@{/incidents/{id}/affecter(id=${incident.id})}"
                   class="rounded-lg border border-violet-300 bg-violet-50 px-4 py-2 text-sm font-medium text-violet-800 hover:bg-violet-100"
                   th:text="${incident.prestataire != null} ? 'Réaffecter' : 'Affecter à un prestataire'">Affecter à un prestataire</a>
                <form th:action="@{/incidents/{id}/resoudre(id=${incident.id})}" method="post" class="inline">
                    <button type="submit" class="rounded-lg bg-green-600 px-4 py-2 text-sm font-medium text-white hover:bg-green-700 transition-colors">
                        Marquer comme résolu
                    </button>
                </form>
            </div>
        </div>

    </div>
</main>

</body>
</html>
