<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Affecter un prestataire - Station404</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800">

<header th:replace="~{banniere :: banniere}"></header>

<main class="max-w-xl mx-auto px-4 py-8">
    <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
        <h1 class="text-xl font-bold mb-1">Affecter un prestataire</h1>
        <p class="text-sm text-slate-500 mb-6" th:text="|Incident équipement : ${incident.equipement.reference}|">Incident sur l'équipement</p>

        <form th:action="@{/incidents/{id}/affecter(id=${incident.id})}" method="post" class="space-y-4">
            <div>
                <label for="idPrestataire" class="block text-sm font-medium text-slate-700 mb-1">Sélectionner un prestataire *</label>
                <select id="idPrestataire" name="idPrestataire" required
                        class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200">
                    <option value="">-- Choisir un prestataire --</option>
                    <option th:each="p : ${prestataires}" th:value="${p.id}" th:text="${p.nom}"></option>
                </select>
            </div>

            <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
                <a th:href="@{/incidents/{id}(id=${incident.id})}" class="text-sm text-slate-600 hover:underline">Annuler</a>
                <button type="submit" class="rounded-lg bg-violet-600 px-4 py-2 text-sm font-medium text-white hover:bg-violet-700">
                    Valider l'affectation
                </button>
            </div>
        </form>
    </div>
</main>

</body>
</html>
