<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Incidents actifs - Station404</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800">

<header th:replace="~{banniere :: banniere}"></header>

<main class="max-w-7xl mx-auto px-4 py-8">

<h1 class="text-2xl font-bold">Historique des incidents</h1>

<div th:unless="${#lists.isEmpty(incidents)}" class="mt-6 overflow-x-auto rounded-xl border border-slate-200 bg-white shadow-sm">
    <table class="min-w-full text-left text-sm">
        <thead class="border-b border-slate-200 bg-slate-50 text-slate-600">
        <tr>
            <th scope="col" class="px-4 py-3 font-semibold">Équipement</th>
            <th scope="col" class="px-4 py-3 font-semibold">Ouvert le</th>
            <th scope="col" class="px-4 py-3 font-semibold">Date de résolution</th>
            <th scope="col" class="px-4 py-3 font-semibold">Prestataire</th>
            <th scope="col" class="px-4 py-3"><span class="sr-only">Actions</span></th>
        </tr>
        </thead>
        <tbody class="divide-y divide-slate-100">
        <tr th:each="incident : ${incidents}" class="hover:bg-slate-50">
            <td class="px-4 py-3 font-medium">
                <a class="text-blue-700 hover:underline"
                   th:text="${incident.equipement.reference}">EQ-0001</a>
            </td>
            <td class="px-4 py-3 text-slate-600" th:text="${#temporals.format(incident.dateOuverture, 'dd/MM/yyyy HH:mm')}"></td>
            <td class="px-4 py-3 text-slate-600"
                th:text="${#temporals.format(incident.dateResolution, 'dd/MM/yyyy HH:mm')}"></td>
            <td class="px-4 py-3 text-slate-600" th:text="${incident.prestataire != null} ? ${incident.prestataire.nom} : '-'">-</td>
            <td class="px-4 py-3 text-right whitespace-nowrap">
                <a th:href="@{/incidents/{id}(id=${incident.id})}" class="font-medium text-blue-700 hover:underline">Voir le détail</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</main>

</body>
</html>
