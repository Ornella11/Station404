<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Déclarer un incident - Station404</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800">

<header th:replace="~{banniere :: banniere}"></header>

<main class="max-w-3xl mx-auto px-4 py-8 bg-slate-100">
    <h1 class="text-2xl font-bold">Déclarer un incident</h1>
    <p class="mt-1 text-sm text-slate-500">
        Choisissez l'équipement concerné. La date et l'heure d'ouverture sont enregistrées automatiquement,
        et l'incident démarre sans prestataire.
    </p>

    <form th:action="@{/incidents}" th:object="${incident}" method="post"
          class="mt-6 space-y-5 rounded-xl border border-slate-200 bg-white p-6 shadow-sm">

        <div class="relative">
            <label for="searchEquipement" class="block text-sm font-medium">Équipement *</label>

            <input type="hidden" id="equipementId" th:field="*{equipement}" required />

            <input type="text" id="searchEquipement" placeholder="Rechercher un équipement..."
                   autocomplete="off"
                   class="mt-1 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200" />

            <ul id="listEquipement" class="absolute z-10 mt-1 max-h-60 w-full overflow-auto rounded-lg border border-slate-200 bg-white shadow-lg hidden">
                <li th:each="equipement : ${equipements}"
                    th:data-id="${equipement.id}"
                    th:data-ref="${equipement.reference}"
                    class="cursor-pointer px-3 py-2 text-sm hover:bg-blue-50 transition-colors"
                    th:text="${equipement.reference} + ': ' + ${equipement.libelle}">
                    Equipement
                </li>
            </ul>
        </div>

        <div>
            <label for="description" class="block text-sm font-medium">Description du problème</label>
            <textarea id="description" th:field="*{description}" rows="5" maxlength="2000"
                      placeholder="Que s'est-il passé ?"
                      class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
                      th:classappend="${#fields.hasErrors('description')} ? 'border-red-500'"></textarea>
        </div>

        <div class="flex items-center justify-end gap-3 border-t border-slate-100 pt-5">
            <a th:href="@{/incidents}" class="text-sm text-slate-600 hover:underline">Annuler</a>
            <button type="submit" class="rounded-lg bg-red-600 px-5 py-2 text-sm font-medium text-white hover:bg-red-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-red-400">
                Déclarer l'incident
            </button>
        </div>
    </form>
</main>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const searchInput = document.getElementById("searchEquipement");
        const hiddenInput = document.getElementById("equipementId");
        const listEquipement = document.getElementById("listEquipement");
        const items = listEquipement.querySelectorAll("li");

        searchInput.addEventListener("focus", function() {
            listEquipement.classList.remove("hidden");
        });

        searchInput.addEventListener("input", function() {
            const filter = searchInput.value.toLowerCase();
            let visibleCount = 0;

            listEquipement.classList.remove("hidden");

            items.forEach(item => {
                const text = item.textContent.toLowerCase();
                if (text.includes(filter)) {
                    item.style.display = "";
                    visibleCount++;
                } else {
                    item.style.display = "none";
                }
            });

            if (filter === "") {
                hiddenInput.value = "";
            }
        });

        items.forEach(item => {
            item.addEventListener("click", function() {
                const id = this.getAttribute("data-id");
                const ref = this.getAttribute("data-ref");

                searchInput.value = ref;
                hiddenInput.value = id;
                listEquipement.classList.add("hidden");
            });
        });

        document.addEventListener("click", function(e) {
            if (!searchInput.contains(e.target) && !listEquipement.contains(e.target)) {
                listEquipement.classList.add("hidden");
            }
        });
    });
</script>

</body>
</html>
