<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Accès refusé - Station404</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800">

<header th:replace="~{banniere :: banniere}"></header>

<main class="max-w-xl mx-auto px-4 py-16 text-center">
    <div class="rounded-xl border border-slate-200 bg-white p-8 shadow-sm">
        <p class="text-5xl font-bold text-red-600">403</p>
        <h1 class="mt-3 text-xl font-bold">Accès refusé</h1>
        <p class="mt-2 text-sm text-slate-600">Vous n'êtes pas autoriser à effectuer cette action.</p>
        <a th:href="@{/}" class="mt-6 inline-block rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700">
            Retour aux dashboard
        </a>
    </div>
</main>

</body>
</html>
