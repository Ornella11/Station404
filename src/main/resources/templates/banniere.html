<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<body>

<header th:fragment="banniere" class="bg-white border-b border-slate-200 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">

        <div class="flex items-center gap-8">
            <a th:href="@{/}" class="flex items-center gap-2">
                <img th:src="@{/images/logo_Station404.png}" alt="Logo Station404" class="h-8">
                <span class="text-lg font-bold text-slate-800">Station404</span>
            </a>

            <nav th:if="${utilisateurConnecte != null}" aria-label="Navigation principale">
                <ul class="flex items-center gap-6 text-sm font-medium text-slate-600">
                    <li><a th:href="@{/stations}" class="hover:text-blue-600">Stations</a></li>
                    <li><a th:href="@{/cartographie}" class="hover:text-blue-600">Cartographie</a></li>
                </ul>
            </nav>
        </div>

        <a th:href="@{/incidents}"
           class="inline-flex items-center gap-2 rounded-lg px-3 py-2 font-medium transition
                  focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500"
           th:classappend="'bg-blue-50 text-blue-700 hover:bg-blue-100'">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
            </svg>
            Gestion des incidents
        </a>

        <div th:if="${utilisateurConnecte != null}" class="flex items-center gap-3 text-sm text-slate-700">
            <span th:text="|Bonjour ${utilisateurConnecte.prenom} (${utilisateurConnecte.profilUtilisateur})|">
                Bonjour Prénom (PROFIL)
            </span>
            <span class="text-slate-300">|</span>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="text-blue-600 hover:underline">Déconnectez-vous</button>
            </form>
        </div>

    </div>
</header>

</body>
</html>
